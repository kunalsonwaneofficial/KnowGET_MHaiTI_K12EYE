name: knowget-mhaiti

# Application services. Compose with the core infra file for a full local stack:
#   docker compose \
#     -f infrastructure/docker/docker-compose.yml \
#     -f infrastructure/docker/docker-compose.apps.yml up --build
services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: knowget-api
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://knowget:knowget@postgres:5432/knowget_mhaiti?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: knowget-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
