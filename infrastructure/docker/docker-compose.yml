name: knowget-mhaiti

# Core local infrastructure services (PostgreSQL + Redis).
# Usage: `pnpm infra:up` / `pnpm infra:down`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: knowget-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowget}
      POSTGRES_DB: ${POSTGRES_DB:-knowget_mhaiti}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowget}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: knowget-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
